<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Right Model. Right Task. | EZCorp</title>
    <meta
      name="description"
      content="A talk and a playground about model routing: sending each request to the AI model that suits it, instead of sending everything to the biggest one."
    />
    <meta name="color-scheme" content="dark" />

    <!--
      Three bars in the lane colours, longest for FAST, shortest for PREMIUM:
      the shape of a routed workload. Inline as a data URI so it costs no
      request. Without any icon at all a browser asks for /favicon.ico and
      logs a 404 on every single page load.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230C0B0A'/><rect x='7' y='8' width='18' height='4' rx='2' fill='%233B9EF5'/><rect x='7' y='14' width='13' height='4' rx='2' fill='%232DBD72'/><rect x='7' y='20' width='8' height='4' rx='2' fill='%23EEC216'/></svg>"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <meta property="og:title" content="Right Model. Right Task." />
    <meta
      property="og:description"
      content="Send each request to the model that suits it. Check the answer. Try again when it fails."
    />
    <meta property="og:type" content="website" />
  </head>
